---
repos:
  # Secrets detection — catches leaked tokens/keys before they enter git
  # history. Uses Semgrep's public p/secrets + p/gitleaks rulesets (OSS engine,
  # no token required). p/gitleaks catches common token formats (GH, AWS, etc);
  # p/secrets adds Semgrep-maintained patterns. The paid Semgrep Secrets product
  # is not enabled on this deployment, so we use these open-source rules.
  - repo: local
    hooks:
      - id: semgrep-secrets
        name: "Semgrep Secrets Scan (p/secrets + p/gitleaks)"
        entry: >-
          bash -c 'command -v semgrep &>/dev/null || exit 0;
          semgrep scan --config=p/secrets --config=p/gitleaks
          --error --quiet --oss-only "$@"' --
        language: system
        pass_filenames: true
        exclude_types: [binary]

  # Python linting
  #
  # There is deliberately NO global Python *formatter* here — see
  # smartwatermelon/dotfiles#190. `black` used to run globally with `--quiet`
  # (i.e. its 88-column default) and rewrote source in place. In any repo that
  # pins a different line length, or that uses `ruff format` instead of black,
  # that produced two failures at once: it reformatted lines the author never
  # touched, and the resulting commit failed that repo's own format check.
  #
  # Measured on smartwatermelon/claude-code-workflows-agents (ruff, line-length
  # 100): a one-line comment-only edit to tools/doc_gardener.py caused black to
  # rewrite 19 additional lines, after which `ruff format --check` reported
  # "1 file would be reformatted" — the commit would have failed CI.
  #
  # Detecting "does this repo have its own opinion?" and skipping — the pattern
  # used by the markdownlint hook below (#116) — was evaluated and rejected for
  # formatters. It relies on a config file at the repo root, and that repo has
  # none: no root pyproject.toml and no .pre-commit-config.yaml. Its ruff
  # settings live in plugins/plugin-eval/pyproject.toml, and CI runs ruff from
  # that directory against files outside it. A root-level probe finds nothing
  # and concludes "safe to format" — failing on the exact repo that prompted
  # this. Which nested config governs a given file is not knowable from a
  # global hook, so formatting is left to each repo's own
  # .pre-commit-config.yaml, where that context exists.
  #
  # Linting stays global: flake8 reports, it does not rewrite, so the
  # worst case is a message rather than a broken commit.
  - repo: https://github.com/PyCQA/flake8
    rev: 7.3.0
    hooks:
      - id: flake8
        name: "Python Lint (flake8)"
        additional_dependencies: [flake8-bugbear]
        # flake8 defaults to max-line-length 79, which is stricter than every
        # formatter in use here (black 88, ruff commonly 88-100) — so an
        # unconfigured flake8 flags correctly-formatted code, including
        # black's own output. Line length is a formatter's job and varies per
        # repo, so E501 is disabled outright. This leaves flake8 doing what it
        # is uniquely good at globally: real bug detection (pyflakes F-codes +
        # bugbear B-codes).
        #
        # --max-line-length=88 is therefore inert today and kept only so that
        # nothing silently falls back to the 79 default: with E501 off, the
        # sole other consumer is bugbear's B950, which is opt-in via
        # extend-select and not enabled here. Verified: a 126-char line
        # passes. No global line-length opinion is imposed on any repo.
        #
        # E402 (import not at top of file) is also ignored: it fires on the
        # standard `sys.path.insert(...)` -before- import idiom that scripts
        # outside an installed package need, which is legitimate rather than a
        # defect. Repos that care about import ordering enforce it locally
        # (ruff's I-rules) with the context to tell the cases apart.
        # NOTE: the ignore list must be quoted — unquoted, YAML flow-sequence
        # syntax splits it at the comma and flake8 receives "E402" as a
        # filename (E902 FileNotFoundError) instead of a rule code.
        args: ["--max-line-length=88", "--extend-ignore=E501,E402"]

  # Shell linting and formatting using global script
  - repo: local
    hooks:
      - id: shell-lint-fix
        name: Shell Scripts Lint & Auto-Fix with Summary
        entry: bash -c '$HOME/.config/git/hooks/lint-shell.sh "$@"' --
        language: system
        types: [shell]
        pass_filenames: true
        verbose: true

  # YAML linting
  - repo: local
    hooks:
      - id: yamllint
        name: "YAML Lint (yamllint)"
        entry: yamllint
        language: system
        types: [yaml]
        pass_filenames: true
        verbose: true

  # HTML validation via tidy
  #
  # Fails only on tidy exit 2 (errors). Exit 1 means "warnings only", which
  # tidyrc sets show-warnings:no to suppress -- failing on 1 rejected files
  # while printing nothing to explain why. Exit codes are tidy's documented
  # contract: 0 clean, 1 warnings, 2 errors.
  #
  # An unreadable or missing file exits 0 while printing "Document: ..." to
  # stdout, so exit status alone would pass a file tidy never parsed. That
  # output is treated as a failure too.
  #
  # Checked per file so one file's status cannot mask another's.
  - repo: local
    hooks:
      - id: html-tidy
        name: "HTML Validation (tidy)"
        entry: >-
          bash -c 'rc=0; for f in "$@"; do
          out=$(tidy -q -e -config "$HOME/.config/tidy/tidyrc" "$f" 2>&1);
          status=$?;
          if [ "$status" -ge 2 ]; then
          printf "tidy: errors in %s\n%s\n" "$f" "$out"; rc=1;
          elif printf "%s" "$out" | grep -q "^Document:"; then
          printf "tidy: could not read %s\n%s\n" "$f" "$out"; rc=1; fi;
          done; exit "$rc"' --
        language: system
        types: [html]
        pass_filenames: true
        verbose: true

  # Markdown linting (Homebrew binary — avoids pre-commit's node-lang npm
  # bootstrap, which breaks on npm releases that dropped --ignore-prepublish)
  #
  # Defers to a repo-local markdownlint config when the target repo has one
  # (e.g. a fork of someone else's repo with its own conventions) instead of
  # always forcing our personal global config — see smartwatermelon/dotfiles#116.
  #
  # That deferral used to be exclusive: the repo-local branch passed no
  # --config at all, so a repo with its own config inherited NONE of the
  # canonical rule disables. MD060 is disabled canonically because it rejects
  # the table style terraform-docs emits, so a repo whose config predates
  # MD060 got the rule at its default and every commit touching a generated
  # README was blocked — with --fix unable to repair it. See #308 and
  # twistedmelonman/claude-config#533.
  #
  # lint-markdown.sh merges the two instead: canonical policy as the base,
  # repo keys layered on top. That matches how CI resolves config
  # (github-workflows standards/run-standards.sh:193-197), so the local gate
  # and standards-check agree on the rules.
  - repo: local
    hooks:
      - id: markdownlint
        name: "Markdown Lint (fix)"
        entry: bash -c '$HOME/.config/git/hooks/lint-markdown.sh "$@"' --
        language: system
        types: [markdown]
        pass_filenames: true
        verbose: true

  # Lua linting
  - repo: local
    hooks:
      - id: luacheck
        name: "Lua Lint (luacheck)"
        entry: luacheck
        language: system
        types: [lua]
        args: [--no-color, --ranges, --codes]
        pass_filenames: true
        verbose: true

  # Prettier formatting for JavaScript/TypeScript/JSON/CSS
  # Note: Markdown excluded - handled by markdownlint above
  - repo: local
    hooks:
      - id: prettier
        name: "Prettier Formatter (JS/TS/JSON/CSS)"
        entry: bash -c 'npx prettier --write --ignore-unknown "$@"' --
        language: system
        files: \.(js|jsx|ts|tsx|json|css)$
        pass_filenames: true
        verbose: true

  # GitHub Actions workflow security linting (zizmor). Catches dangerous
  # triggers, cache poisoning, unpinned actions, template injection, and
  # excessive permissions in .github/workflows/*. Tier 3 follow-up to the
  # 2026-04-29 GitHub Actions security audit — see
  # smartwatermelon/dev-env#19. Requires `brew install zizmor` once locally
  # (language: system expects the binary already on PATH).
  #
  # zizmor lints the whole file, not just your staged diff — so pre-existing
  # findings elsewhere in a workflow file can block a commit even when your
  # actual change is a one-line, unrelated edit. In repos with strict
  # no-drive-by-cleanup norms (where bundling an unrelated zizmor fix into
  # your commit isn't welcome), use `SKIP=zizmor git commit` as the
  # supported escape hatch. Tradeoff: this also skips checking your own
  # newly-staged lines, so if you want assurance your change didn't
  # introduce a new finding, run `zizmor <file>` manually afterward and
  # check whether any reported findings' line ranges overlap your diff.
  - repo: local
    hooks:
      - id: zizmor
        name: "GitHub Actions Security Lint (zizmor)"
        entry: zizmor
        language: system
        files: ^\.github/workflows/.*\.ya?ml$
        pass_filenames: true
        verbose: true
